<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>word counter for em</title>
</head>
<body>
    <h1>Word Counter</h1>

    <form method="POST">
        <textarea
            name="text"
            rows="10"
            cols="50"
            placeholder="Copy your text here..."
        ></textarea>

        <br><br>

        <button type="submit">Count Words</button>
    </form>

    {% if words is not none %}
        <h2>Word count: {{ words }}</h2>
    {% endif %}

</body>
</html>
